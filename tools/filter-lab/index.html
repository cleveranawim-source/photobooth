<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>필터 실험실</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font: 14px/1.4 -apple-system, "Pretendard", sans-serif; background: #f4f7fa; color: #123a5c; }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #dde6ee; position: sticky; top: 0; z-index: 2; }
      header label { display: inline-flex; gap: 6px; align-items: center; }
      header input[type="number"] { width: 70px; }
      #grid { padding: 12px 16px; display: grid; gap: 14px; }
      .row { background: #fff; border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 1px 2px rgba(18,58,92,.08); }
      .row h2 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
      .row h2 small { color: #6b7d8f; font-weight: 500; }
      .cells { display: flex; gap: 8px; }
      .cells canvas { display: block; width: var(--cell, 300px); height: auto; border-radius: 6px; }
      #timing { color: #6b7d8f; }
    </style>
  </head>
  <body>
    <header>
      <input id="files" type="file" accept="image/*" multiple />
      <label>표시 폭 <input id="width" type="number" value="300" min="120" max="800" /></label>
      <label>처리 폭 <input id="work" type="number" value="700" min="200" max="2400" /></label>
      <label>피부 보정 <input id="skin" type="number" value="0.4" min="0" max="1" step="0.1" /></label>
      <label><input id="only" type="text" placeholder="필터 키(쉼표) — 비우면 전부" size="28" /></label>
      <button id="run">적용</button>
      <span id="timing"></span>
    </header>
    <div id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
